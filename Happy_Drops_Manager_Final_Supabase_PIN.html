function btccCustomerStatus(c){if(c.closed===true)return "closed";if(c.pending===true)return "pending";return "active"}

function newRental(){let d=new Date(),ds=d.toISOString().slice(0,10),ts=d.toTimeString().slice(0,5);document.getElementById("app").innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><div><div class="small">BT/CC RENTALS</div><h2 style="margin:3px 0">New Rental Customer</h2></div><button class="btn secondary" onclick="rentals()">← Back</button></div><div class="grid" style="margin-top:14px"><div><label>Customer Name</label><div class="voice-name-wrap"><input id="rn" placeholder="Enter customer name"><button class="voice-mic-btn" type="button" onclick="startRentalNameVoice(event)" aria-label="Type customer name by voice">🎤</button></div><div id="rentalVoiceStatus" class="small voice-status"></div></div><div><label>Mobile Number</label><div style="display:flex;gap:6px"><input id="rphone" inputmode="numeric" maxlength="10" placeholder="10 digit mobile" oninput="validateRentalPhone()"><button class="btn" style="white-space:nowrap;padding:9px 10px" onclick="verifyRentalPhone(event)">📞 Verify</button></div><div id="rphoneErr" style="color:#d32f2f;font-size:12px;margin-top:4px"></div></div><div><label>Security Deposit</label><input id="rdep" type="number" placeholder="" oninput="calculateNewRentalBill()"></div><div><label>Rental Date</label><input id="rdate" type="date" value="${ds}"></div><div><label>Rental Time</label><input id="rtime" type="time" step="60" value="${ts}" lang="en-US"><div id="rentalTime12Display" class="small" style="margin-top:4px">${formatRentalTime12(ts)}</div></div><div><label>Return Date <span class="small" style="font-weight:400">(Optional)</span></label><input id="rreturnDate" type="date" min="${ds}" oninput="updateRentalReturnDays()"><div id="rreturnDays" class="small" style="margin-top:4px;color:#16803c;font-weight:600"></div></div><div><label style="color:#16803c">BT/PBT Quantity × Price</label><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input id="rpbt" type="number" min="0" placeholder="Quantity" style="border-color:#8bcf9d" oninput="validateRentalCans();calculateNewRentalBill()"><input id="rpbtPrice" type="number" min="0" step="0.01" value="20" oninput="calculateNewRentalBill()" placeholder="₹ Price" style="border-color:#8bcf9d"></div><div class="small" style="margin-top:4px;color:#16803c">Price per BT/PBT: ₹20 default</div></div><div><label style="color:#c62828">CC Quantity × Price</label><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input id="rcc" type="number" min="0" placeholder="Quantity" style="border-color:#e79a9a" oninput="validateRentalCans();calculateNewRentalBill()"><input id="rccPrice" type="number" min="0" step="0.01" value="50" oninput="calculateNewRentalBill()" placeholder="₹ Price" style="border-color:#e79a9a"></div><div class="small" style="margin-top:4px;color:#c62828">Price per CC: ₹50 default</div></div></div><div id="rentalCanErr" style="color:#d32f2f;font-size:12px;margin-top:6px"></div>
<div id="newRentalBillingPreview" class="card" style="margin-top:12px;padding:12px;background:#f8fbfd;border:1px solid #dcebf3">

  </div>
</div>
<br><button class="btn" onclick="saveRental()">Save Customer</button><button class="btn secondary" style="margin-left:6px" onclick="rentals()">Cancel</button></div>`;document.getElementById('rtime').addEventListener('input',updateRentalTime12Display);calculateNewRentalBill();}
function formatRentalTime12(v){if(!v)return"";let [h,m]=v.split(":").map(Number),ap=h>=12?"PM":"AM",hh=h%12||12;return `${String(hh).padStart(2,'0')}:${String(m).padStart(2,'0')} ${ap}`}
function updateRentalTime12Display(){let e=document.getElementById('rentalTime12Display'),t=document.getElementById('rtime');if(e&&t)e.textContent=formatRentalTime12(t.value)}
function validateRentalPhone(){let e=document.getElementById('rphoneErr'),v=document.getElementById('rphone')?.value.replace(/\D/g,'')||'';if(document.getElementById('rphone'))document.getElementById('rphone').value=v;if(e)e.textContent=v.length===0?'':(v.length!==10?'Please enter a valid 10 digits mobile number.':'')}
function verifyRentalPhone(e){e.stopPropagation();let v=(document.getElementById('rphone')?.value||'').trim();if(v.length!==10){validateRentalPhone();alert('Please enter a valid 10 digits mobile number.');return}window.location.href='tel:'+v}
function validateRentalCans(){let p=(+document.getElementById('rpbt')?.value||0),c=(+document.getElementById('rcc')?.value||0),e=document.getElementById('rentalCanErr');if(e)e.textContent=(p<=0&&c<=0)?'Please enter at least one BT/PBT quantity or CC quantity.':''}
function updateRentalReturnDays(){
 const el=document.getElementById("rreturnDays"); if(!el) return;
 const v=document.getElementById("rreturnDate")?.value;
 if(!v){el.textContent=""; return;}
 const today=new Date(); today.setHours(0,0,0,0);
 const ret=new Date(v+"T00:00:00"); ret.setHours(0,0,0,0);
 const days=Math.round((ret-today)/86400000);
 el.textContent=days===0?"Today":`${days} ${days===1?"day":"days"}`;
}

function calculateNewRentalBill(){
  const p=Number(document.getElementById('rpbt')?.value)||0;
  const c=Number(document.getElementById('rcc')?.value)||0;
  const ppRaw=document.getElementById('rpbtPrice')?.value;
  const cpRaw=document.getElementById('rccPrice')?.value;
  const pp=ppRaw===''?20:(Number(ppRaw)||0);
  const cp=cpRaw===''?50:(Number(cpRaw)||0);
  const dep=Number(document.getElementById('rdep')?.value)||0;
  const pAmt=p*pp, cAmt=c*cp, bill=pAmt+cAmt;
  const refund=Math.max(0,dep-bill);
  const money=v=>'₹'+Number(v).toFixed(2).replace(/\.00$/,'');
  const lines=document.getElementById('newRentalBillLines');
  const billed=document.getElementById('newRentalBilledAmount');
  const refundable=document.getElementById('newRentalRefundableAmount');
  if(lines) lines.innerHTML=`BT/PBT: ${p} × ${money(pp)} = ${money(pAmt)}<br>CC: ${c} × ${money(cp)} = ${money(cAmt)}`;
  if(billed) billed.textContent=money(bill);
  if(refundable) refundable.textContent=money(refund);
}
function startRentalNameVoice(e){
  e.preventDefault();
  const input=document.getElementById('rn');
  const status=document.getElementById('rentalVoiceStatus');
  const btn=e.currentTarget;
  const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SpeechRecognition){
    status.textContent='Voice typing is not supported in this browser. Try Chrome on Android.';
    status.style.color='#c62828';
    return;
  }
  if(window.__rentalRecognition){
    try{window.__rentalRecognition.stop()}catch(_){}
    window.__rentalRecognition=null;
    btn.classList.remove('listening');
    status.textContent='';
    return;
  }
  const recognition=new SpeechRecognition();
  window.__rentalRecognition=recognition;
  recognition.lang='en-IN';
  recognition.interimResults=false;
  recognition.maxAlternatives=1;
  btn.classList.add('listening');
  status.style.color='#087fc1';
  status.textContent='Listening… speak the customer name';
  recognition.onresult=function(ev){
    const text=(ev.results&&ev.results[0]&&ev.results[0][0]&&ev.results[0][0].transcript||'').trim();
    if(text) input.value=text.charAt(0).toUpperCase()+text.slice(1);
  };
  recognition.onerror=function(ev){
    status.style.color='#c62828';
    status.textContent=ev.error==='not-allowed'?'Microphone permission was denied. Please allow microphone access.':'Could not hear the name. Please try again.';
  };
  recognition.onend=function(){
    btn.classList.remove('listening');
    window.__rentalRecognition=null;
    if(status.textContent==='Listening… speak the customer name') status.textContent='';
  };
  try{recognition.start()}catch(err){
    btn.classList.remove('listening');
    window.__rentalRecognition=null;
    status.style.color='#c62828';
    status.textContent='Could not start voice typing. Please try again.';
  }
}

function rentalActivityStamp(ts){const d=new Date(ts||Date.now());const date=String(d.getDate()).padStart(2,"0")+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getFullYear()).slice(-2);return date+", "+formatRentalTime12(String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"));}

function rentalMoney(c){
  const add=(c.additions||[]).reduce((s,x)=>s+(Number(x.deposit)||0),0);
  const money=(c.depositRefunds||[]).reduce((s,x)=>s+(Number(x.deposit)||0)-(Number(x.refund)||0),0);
  const base=Number(c.deposit)||0;
  return base+add+money;
}
function rentalDaysBetween(fromDate,toDate){
  if(!fromDate||!toDate)return 0;
  const a=new Date(String(fromDate)+'T00:00:00');
  const b=new Date(String(toDate)+'T00:00:00');
  if(Number.isNaN(a.getTime())||Number.isNaN(b.getTime()))return 0;
  return Math.max(0,Math.floor((b-a)/86400000));
}
function rentalChargeForCan(issueDate,endDate,rate,maxCharge){
  const days=rentalDaysBetween(issueDate,endDate);
  const chargeBlocks=days>=3?Math.floor((days-1)/2):0;
  return Math.min(maxCharge,chargeBlocks*rate);
}
function rentalCharges(c){
  // Rental charges apply only when the customer has actually paid a deposit
  // and the normal bill still leaves a refundable amount.
  const deposit=rentalMoney(c);
  if(deposit<=0)return {bt:0,cc:0,total:0};
  const additions=c.additions||[], returns=(c.returns||[]).slice().sort((a,b)=>(Number(a.ts)||0)-(Number(b.ts)||0));
  const batches=[];
  const baseDate=c.rentalDate||localDateKey(new Date());
  if(Number(c.pbt)||0)batches.push({type:'BT',qty:Number(c.pbt)||0,date:baseDate});
  if(Number(c.cc)||0)batches.push({type:'CC',qty:Number(c.cc)||0,date:baseDate});
  additions.forEach(x=>{const d=x.date||localDateKey(new Date(Number(x.ts)||Date.now()));if(Number(x.pbt)||0)batches.push({type:'BT',qty:Number(x.pbt)||0,date:d});if(Number(x.cc)||0)batches.push({type:'CC',qty:Number(x.cc)||0,date:d});});
  let chargeBT=0,chargeCC=0,remainingReturns={BT:0,CC:0};
  returns.forEach(r=>{remainingReturns.BT+=(Number(r.pbt)||0);remainingReturns.CC+=(Number(r.cc)||0)});
  const now=localDateKey(new Date());
  ['BT','CC'].forEach(type=>{
    let toReturn=remainingReturns[type];
    batches.filter(b=>b.type===type).forEach(b=>{
      const returned=Math.min(b.qty,toReturn);
      toReturn-=returned;
      const open=b.qty-returned;
      const perCan=type==='BT'?5:10, maxPerCan=type==='BT'?60:80;
      const batchCharge=rentalChargeForCan(b.date,now,perCan,maxPerCan);
      if(type==='BT')chargeBT+=batchCharge*open;
      else chargeCC+=batchCharge*open;
    });
  });
  return {bt:chargeBT,cc:chargeCC,total:chargeBT+chargeCC};
}
function rentalTotals(c){
  const returns=c.returns||[];
  const returnedBT=returns.reduce((s,x)=>s+(Number(x.pbt)||0),0);
  const returnedCC=returns.reduce((s,x)=>s+(Number(x.cc)||0),0);
  const additions=c.additions||[];
  const newBT=(Number(c.pbt)||0)+additions.reduce((s,x)=>s+(Number(x.pbt)||0),0);
  const newCC=(Number(c.cc)||0)+additions.reduce((s,x)=>s+(Number(x.cc)||0),0);
  const btPrice=Number.isFinite(+c.pbtPrice)?+c.pbtPrice:20;
  const ccPrice=Number.isFinite(+c.ccPrice)?+c.ccPrice:50;
  const pendingBT=Math.max(0,newBT-returnedBT);
  const pendingCC=Math.max(0,newCC-returnedCC);
  const refillBT=(c.refills||[]).reduce((s,x)=>s+(Number(x.pbt)||0),0);
  const refillCC=(c.refills||[]).reduce((s,x)=>s+(Number(x.cc)||0),0);
  const newBill=newBT*btPrice+newCC*ccPrice;
  const returnedBill=0;
  const bill=newBill;
  const refillBill=refillBT*15+refillCC*30;
  const deposit=rentalMoney(c);
  const baseBill=bill+refillBill;
  // No deposit = no rental. If the normal bill already consumes the deposit,
  // the customer is in Bill status, so rental charges are not applied.
  const baseRefund=Math.max(0,deposit-baseBill);
  const rental=baseRefund>0?rentalCharges(c):{bt:0,cc:0,total:0};
  const totalBill=baseBill+rental.total;
  const refund=Math.max(0,deposit-totalBill);
  const extraBill=Math.max(0,totalBill-deposit);
  return {bt:newBT,cc:newCC,returnedBT,returnedCC,pendingBT,pendingCC,refillBT,refillCC,newBill,returnedBill,bill,refillBill,rentalBT:rental.bt,rentalCC:rental.cc,rentalBill:rental.total,deposit,refund,extraBill,totalBill,btPrice,ccPrice};
}

function saveEditedStaff(old){let n=esn.value.trim();if(!n)return alert("Enter employee name");if(n!==old&&staff[n])return alert("Staff already exists.");if(n!==old){staff[n]=staff[old];delete staff[old];staffOrder=staffOrder.map(x=>x===old?n:x)}staff[n]={...staff[n],phone:esp.value,startDate:ess.value,salary:+essal.value||0,shiftLogin:esl.value,shiftLogout:eso.value,deleted:false};save();manageStaff()}
function toggleStaffHidden(n){staff[n].hidden=!staff[n].hidden;save();manageStaff()}
function deleteStaff(n){if(!confirm("Remove this staff member? Historical attendance will be retained."))return;staff[n].deleted=true;staff[n].hidden=true;save();manageStaff()}
function moveStaff(i,d){let j=i+d;if(j<0||j>=staffOrder.length)return;[staffOrder[i],staffOrder[j]]=[staffOrder[j],staffOrder[i]];save();manageStaff()}

function manageProducts(){
 let keys=Object.keys(productSettings);
 document.getElementById("app").innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><div><h2>📦💰 Manage Products & Rates</h2><span class="small">Default settings for the entire app</span></div><button class="btn secondary" onclick="ownerDashboard()">← Back</button></div><br><button class="btn" onclick="newProduct()">＋ Add New Product</button><div id="productAdminList" style="margin-top:12px"></div></div>`;

function renderProductAdmin(){
 let keys=Object.keys(productSettings);
 productAdminList.innerHTML=keys.map((k,i)=>{let x=productSettings[k];return `<div class="prod" style="display:flex;align-items:center;gap:7px;opacity:${x.hidden?.55:1}">
 <div style="flex:1"><b>${x.name}</b> <span class="small">(${x.shortcut})</span><div class="small">Dealer ₹${x.dealerRate} &nbsp; Customer ₹${x.customerRate} ${x.hidden?" · HIDDEN":""}</div></div>

function newProduct(){
 document.getElementById("app").innerHTML=`<div class="card"><h2>＋ Add New Product</h2><div class="grid"><div><label>Product Name</label><input id="pn" placeholder="e.g. 2L Bottle"></div><div><label>Shortcut</label><input id="ps" placeholder="e.g. 2L"></div><div><label>Dealer Rate ₹</label><input id="pdr" type="number" step="0.01" placeholder=""></div><div><label>Customer Rate ₹</label><input id="pcr" type="number" step="0.01" placeholder=""></div><div><label>Save Rate as Default</label><select id="pdef"><option value="yes">Yes — apply across the app</option><option value="no">No</option></select></div><div><label>Bottles per Case (optional)</label><input id="pcb" type="number" placeholder=""></div></div><br><button class="btn" onclick="saveNewProduct()">💾 Save Product</button> <button class="btn secondary" onclick="manageProducts()">Cancel</button></div>`;
}
function saveNewProduct(){
 let name=pn.value.trim(),shortcut=ps.value.trim();
 if(!name||!shortcut)return alert("Enter product name and shortcut.");
 if(productSettings[shortcut])return alert("This shortcut already exists.");
 productSettings[shortcut]={name,shortcut,dealerRate:+pdr.value||0,customerRate:+pcr.value||0,hidden:false,cases:+pcb.value||0};
 syncProducts();save();alert("Product and default rates saved successfully.");manageProducts();
}
function editProduct(k){
 let x=productSettings[k];
 document.getElementById("app").innerHTML=`<div class="card"><h2>✏️ Edit Product</h2><div class="grid"><div><label>Product Name</label><input id="epn" value="${x.name}"></div><div><label>Shortcut</label><input id="eps" value="${x.shortcut}"></div><div><label>Dealer Rate ₹</label><input id="epdr" type="number" step="0.01" value="${x.dealerRate}"></div><div><label>Customer Rate ₹</label><input id="epcr" type="number" step="0.01" value="${x.customerRate}"></div><div><label>Save Rate as Default</label><select id="epdef"><option value="yes">Yes — apply across the app</option><option value="no">No</option></select></div><div><label>Bottles per Case (optional)</label><input id="epcb" type="number" value="${x.cases||""}"></div></div><br>
 <button class="btn" onclick='saveEditedProduct(${JSON.stringify(k)})'>💾 Save Changes</button>
 <button class="btn secondary" onclick='toggleProductHidden(${JSON.stringify(k)})'>${x.hidden?"👁️ Unhide Product":"👁️ Hide Product"}</button>
 <button class="btn danger" onclick='deleteProduct(${JSON.stringify(k)})'>🗑️ Delete Product</button>
 <button class="btn secondary" onclick="manageProducts()">Cancel</button></div>`;
}
function saveEditedProduct(oldKey){
 let name=epn.value.trim(),shortcut=eps.value.trim();
 if(!name||!shortcut)return alert("Enter product name and shortcut.");
 if(shortcut!==oldKey&&productSettings[shortcut])return alert("This shortcut already exists.");
 let x={...productSettings[oldKey],name,shortcut,dealerRate:+epdr.value||0,customerRate:+epcr.value||0,cases:+epcb.value||0};
 if(shortcut!==oldKey){productSettings[shortcut]=x;delete productSettings[oldKey]}else productSettings[oldKey]=x;
 syncProducts();save();alert("Product and default rates updated across the app.");manageProducts();
}
function toggleProductHidden(k){productSettings[k].hidden=!productSettings[k].hidden;save();manageProducts()}
function deleteProduct(k){if(!confirm("Delete this product? This removes it from the active product settings."))return;delete productSettings[k];delete P[k];save();manageProducts()}
function moveProduct(i,dir){
 let keys=Object.keys(productSettings),j=i+dir;if(j<0||j>=keys.length)return;
 let reordered={};[...keys].forEach((k,idx)=>{let from=idx;if(idx===i)from=j;else if(idx===j)from=i;reordered[k]=productSettings[keys[from]]});
 productSettings=reordered;syncProducts();save();manageProducts();
}


function money(){
 drawer.classList.remove("open");
 const den=[500,200,100,50,20,10,5,2,1];
 document.getElementById("app").innerHTML=`<div class="card" style="max-width:620px;margin:0 auto">
 <div style="display:flex;justify-content:space-between;align-items:center"><div><h2 style="margin:3px 0">🧮 Money Calculator</h2></div><button class="btn secondary" onclick="home()">← Home</button></div>
 <div style="margin-top:14px">
 ${den.map(d=>`<div class="moneyrow"><div class="moneyden">₹${d}</div><div class="moneyop">×</div><input id="money_${d}" type="number" min="0" step="1" inputmode="numeric" placeholder="0" oninput="calculateMoney()"><div class="moneyop">=</div><div id="money_amt_${d}" class="amt">₹0</div></div>`).join("")}
 </div>
 <div class="total"><span>Total</span><span id="moneyTotal">₹0</span></div>
 <div style="display:flex;gap:8px;margin-top:12px"><button class="btn" style="flex:1" onclick="shareMoneyWhatsApp()">📲 Share WhatsApp</button><button class="btn secondary" onclick="clearMoneyCalculator()">Clear</button></div>
 </div>`;
 calculateMoney();
}
function calculateMoney(){
 const den=[500,200,100,50,20,10,5,2,1];
 let total=0;
 den.forEach(d=>{
   const e=document.getElementById("money_"+d), out=document.getElementById("money_amt_"+d);
   let q=Math.max(0,Math.floor(Number(e?.value)||0));
   if(e && String(q)!==e.value && e.value!=="") e.value=q;
   const amt=q*d; total+=amt;
   if(out) out.textContent="₹"+amt.toLocaleString("en-IN");
 });
 const t=document.getElementById("moneyTotal"); if(t)t.textContent="₹"+total.toLocaleString("en-IN");
 return total;
}
function clearMoneyCalculator(){
 [500,200,100,50,20,10,5,2,1].forEach(d=>{const e=document.getElementById("money_"+d);if(e)e.value="";});
 calculateMoney();
}
function shareMoneyWhatsApp(){
 const den=[500,200,100,50,20,10,5,2,1];
 let lines=[],total=0;
 den.forEach(d=>{
   const q=Math.max(0,Math.floor(Number(document.getElementById("money_"+d)?.value)||0));
   if(q){const amt=q*d;lines.push(`₹${d} × ${q} = ₹${amt}`);total+=amt;}
 });
 if(!lines.length){alert("Please enter at least one denomination.");return;}
 const msg=`*Happy Drops*\n_(Packaged Drinking Water)_\n\n*Money Calculator*\n${lines.join("\n")}\n\n*Total: ₹${total}*`;
 window.open("https://wa.me/?text="+encodeURIComponent(msg),"_blank");
}

ensureSyncBadge();home();
